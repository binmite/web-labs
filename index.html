<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsplash Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="header__title">Unsplash Gallery</h1>
            <div class="search">
                <div class="search__container">
                    <input 
                        type="text" 
                        class="search__input" 
                        placeholder="Поиск изображений..." 
                        autocomplete="off"
                    >
                    <button class="search__clear" type="button" aria-label="Очистить поиск">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10 8.586L15.586 3 17 4.414 11.414 10 17 15.586 15.586 17 10 11.414 4.414 17 3 15.586 8.586 10 3 4.414 4.414 3 10 8.586z"/>
                        </svg>
                    </button>
                </div>
                <button class="search__button" type="button" aria-label="Искать">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"/>
                    </svg>
                </button>
            </div>
            <div class="filters">
                <select class="filters__select" id="sort-filter">
                    <option value="relevant">По релевантности</option>
                    <option value="latest">Сначала новые</option>
                    <option value="popular">По популярности</option>
                </select>
                <select class="filters__select" id="color-filter">
                    <option value="">Все цвета</option>
                    <option value="black_and_white">Черно-белые</option>
                    <option value="black">Черный</option>
                    <option value="white">Белый</option>
                    <option value="yellow">Желтый</option>
                    <option value="orange">Оранжевый</option>
                    <option value="red">Красный</option>
                    <option value="purple">Фиолетовый</option>
                    <option value="magenta">Пурпурный</option>
                    <option value="green">Зеленый</option>
                    <option value="teal">Бирюзовый</option>
                    <option value="blue">Синий</option>
                </select>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="gallery" id="gallery">
                <div class="loading" id="loading">
                    <div class="loading__spinner"></div>
                    <p class="loading__text">Загрузка изображений...</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="footer__text">
                © <span id="current-year">2024</span> Unsplash Gallery
            </p>
            <a 
                href="https://github.com/binmite" 
                class="footer__link" 
                target="_blank" 
                rel="noopener noreferrer"
            >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                GitHub
            </a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
